<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace — AI roadmap (editable) | Nigents</title>
  <link rel="stylesheet" href="brief.css" />
  <script src="/workspace/workspace-multi-app.js?v=2"></script>
</head>
<body class="workspace-theme">
  <div class="top-banner"></div>
  <div class="hub-nav header-inner" style="padding-top:16px;padding-bottom:0;">
    <a href="./">← Workspace hub</a>
    &nbsp;·&nbsp;
    <a href="/">Nigents home</a>
  </div>
  <header class="header">
    <div class="header-inner">
      <h1 class="brief-title shimmer-title" style="font-size:1.65rem;margin-bottom:8px;"><span class="accent">AI roadmap</span> — editable</h1>
      <p class="brief-subtitle" style="max-width:720px;">
        Items are stored in MySQL (<code>workspace_ai_roadmap</code>). Use the same <strong style="color:var(--accent-orange);">WORKSPACE_EDIT_SECRET</strong> as on fix briefs to add, edit, or remove entries.
      </p>
      <div class="edit-key-bar" style="margin-top:16px;">
        <span><strong>Edit key</strong> — <code>WORKSPACE_EDIT_SECRET</code>:</span>
        <input type="password" id="roadmap-edit-key" placeholder="Paste secret, then Save" autocomplete="off" />
        <button type="button" id="roadmap-save-key">Save</button>
      </div>
    </div>
  </header>
  <main class="ai-features-page" id="roadmap-root">
    <p class="load-err" id="roadmap-loading">Loading roadmap…</p>
  </main>
  <footer>
    <div class="footer-logos">
      <div class="footer-n" aria-hidden="true">N</div>
      <img src="assets/problem-x-logo.png" alt="Problem-X" />
    </div>
    <div class="footer-txt">Nigents · Problem-X · Consult Code Achieve</div>
  </footer>
  <div class="toast" id="toast"></div>
  <script src="ai-roadmap.js"></script>
</body>
</html>
