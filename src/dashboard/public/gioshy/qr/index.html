<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AlGioshy Steel — Connect With Us</title>
    <meta name="description" content="Follow AlGioshy Steel on LinkedIn, Facebook, X, and Instagram." />
    <meta name="theme-color" content="#ffffff">

    <!-- Open Graph -->
    <meta property="og:title" content="AlGioshy Steel" />
    <meta property="og:description" content="Connect with AlGioshy Steel on social media." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nigents.com/gioshy/qr/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #ffffff;
            --bg-soft:   #fafafa;
            --bg-card:   #ffffff;
            --ink:       #0a1420;       /* deep navy — primary text */
            --ink-soft:  #475569;       /* slate — body text */
            --ink-muted: #94a3b8;       /* secondary text / handles */
            --accent:    #db4d27;       /* AlGioshy brand orange (rebar) */
            --accent-dark: #a83a1c;
            --hot:       #ff6b35;
            --border:        #e8e8eb;
            --border-strong: #d4d4d8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
              radial-gradient(ellipse at 50% -10%, rgba(219, 77, 39, 0.10) 0%, transparent 55%),
              radial-gradient(ellipse at 50% 110%, rgba(255, 107, 53, 0.06) 0%, transparent 50%),
              var(--bg);
            color: var(--ink);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 32px 20px 48px;
            position: relative;
            overflow-x: hidden;
        }

        /* Faint warm grid — barely visible */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
              linear-gradient(rgba(219, 77, 39, 0.045) 1px, transparent 1px),
              linear-gradient(90deg, rgba(219, 77, 39, 0.045) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            z-index: 0;
        }

        .stage {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* ── Logo (full AlGioshy wordmark) ─────────────────────────── */
        .logo {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.7s 0.05s ease both;
            /* No drop-shadow on white — keeps the logo crisp */
        }
        @media (max-width: 360px) { .logo { max-width: 260px; } }

        h1 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
            margin-bottom: 4px;
            color: var(--ink);
            opacity: 0;
            animation: fadeUp 0.7s 0.15s ease both;
        }
        .lead {
            font-size: 15px;
            color: var(--ink-soft);
            margin-bottom: 36px;
            max-width: 340px;
            opacity: 0;
            animation: fadeUp 0.7s 0.35s ease both;
        }

        /* ── Social link buttons ───────────────────────────────────── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 32px;
        }
        .link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 600;
            font-size: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(10, 20, 32, 0.04);
            transition: transform 0.18s ease, border-color 0.2s, box-shadow 0.2s;
            opacity: 0;
            animation: fadeUp 0.55s ease both;
            -webkit-tap-highlight-color: transparent;
        }
        .link:nth-child(1) { animation-delay: 0.45s; }
        .link:nth-child(2) { animation-delay: 0.55s; }
        .link:nth-child(3) { animation-delay: 0.65s; }

        .link::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(219, 77, 39, 0.06) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            pointer-events: none;
        }
        .link:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px -8px rgba(219, 77, 39, 0.30), 0 2px 4px rgba(10, 20, 32, 0.06);
        }
        .link:hover::after {
            transform: translateX(100%);
        }
        .link:active { transform: translateY(0); }

        .link .icon {
            flex-shrink: 0;
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .link .icon svg { width: 22px; height: 22px; }

        .link-li .icon { background: linear-gradient(135deg, #0a66c2 0%, #084a8a 100%); }
        .link-fb .icon { background: linear-gradient(135deg, #1877f2 0%, #0d5bb9 100%); }
        .link-ig .icon {
            background:
              radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        .link .label {
            flex: 1;
            text-align: left;
            display: flex; flex-direction: column;
            min-width: 0;
        }
        .link .name {
            font-weight: 700;
            font-size: 15px;
            color: var(--ink);
        }
        .link .handle {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link .arrow {
            flex-shrink: 0;
            color: var(--ink-muted);
            transition: transform 0.2s ease, color 0.2s;
        }
        .link:hover .arrow { transform: translate(2px, -2px); color: var(--accent); }

        /* ── Footer note ─────────────────────────────────────────── */
        .foot {
            margin-top: auto;
            padding-top: 20px;
            font-size: 12px;
            color: var(--ink-muted);
            opacity: 0;
            animation: fadeUp 0.7s 0.95s ease both;
        }
        .foot strong { color: var(--accent); font-weight: 700; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo, h1, .lead, .link, .foot {
                animation: none !important; opacity: 1 !important; transform: none !important;
            }
            .link::after { display: none; }
        }

        @media (max-width: 360px) {
            .link { padding: 14px 16px; gap: 12px; }
            .link .icon { width: 40px; height: 40px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
